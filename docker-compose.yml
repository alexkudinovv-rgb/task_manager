# Local development services. Production adds the app and Caddy on top (stage 9).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
