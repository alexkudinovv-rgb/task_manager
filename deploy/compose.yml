services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasks
      POSTGRES_DB: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasks -d tasks']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:?Set APP_ENV_FILE}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WEB_DIST: /app/apps/web/dist
      FILE_STORAGE_DIR: /app/apps/server/storage
    volumes:
      - uploads:/app/apps/server/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
